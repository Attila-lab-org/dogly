[project]
name = "canine-backend"
version = "0.1.0"
description = "Canine Behavioral Intelligence — public FastAPI API + private worker (Gate G1/G2 backend skeleton)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "uvicorn>=0.30",
    "vercel-workflow>=0.9.0",
    "sentry-sdk[fastapi]>=2.68.1",
]

[[tool.vercel.workflows]]
entrypoint = "app.workflows:wf"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "cryptography>=43.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
