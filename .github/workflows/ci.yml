# CI (Spec V1 sez. 3.1 / 28.1): gate su push/PR verso main.
# - mobile: npm ci → typecheck (tsc) → unit test (jest)
# - backend: uv sync → ruff → pytest (chiamate AI reali mockate via fixture)
# - supabase: migration reset su stack locale (riproducibilità da vuoto, sez. 11.1)
# - openapi-drift: export OpenAPI FastAPI e diff vs docs/openapi.json —
#   la CI fallisce su contract drift non committato (sez. 3.1 / 28.1).
# Nessun segreto in chiaro: tutti i job girano solo su risorse locali/mock.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (uv sync)
        run: uv sync
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Start local stack
        run: supabase start
      - name: RLS / quota / privacy SQL tests (sez. 26.1 / 28.1)
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_DB_URL="$DB_URL"
          set +e
          bash supabase/tests/run_tests.sh 2>&1 | tee /tmp/supabase-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            details="$(tail -n 30 /tmp/supabase-tests.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error title=Supabase SQL tests failed::$details"
            exit "$status"
          fi

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install backend deps
        run: uv sync
        working-directory: backend
      - name: Export OpenAPI from FastAPI (source of truth, sez. 3.1)
        run: uv run python ../scripts/export_openapi.py --out /tmp/openapi.generated.json
        working-directory: backend
      - name: Fail on uncommitted contract drift
        run: diff -u docs/openapi.json /tmp/openapi.generated.json

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            detect --source=/repo --redact --verbose 2>&1 | tee /tmp/gitleaks.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            details="$(tail -n 40 /tmp/gitleaks.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error title=Gitleaks scan failed::$details"
            exit "$status"
          fi

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Backend dependency audit (offline-friendly)
        working-directory: backend
        run: |
          uv sync
          uv pip compile pyproject.toml -o /tmp/reqs.txt
          # No paid provider calls in CI — assert mock defaults in tests.
          uv run pytest -q tests/test_config_fail_fast.py
